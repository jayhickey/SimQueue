name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR pushes supersede each other; main runs must finish because Release follows them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SIMQ_NO_AUTOSTART: "1"
  SIMQ_REAL_READONLY: ""
  SIMQ_SOAK_HOURS: "4"

jobs:
  macos:
    name: Apple silicon build and full fake tests
    # Disposable GitHub-hosted ARM64 VM. Never register a personal runner for public PRs.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated paths and ARM64 toolchain
        run: |
          set -eu
          test "$(uname -m)" = arm64
          /usr/bin/swift --version
          ROOT="$RUNNER_TEMP/sq"
          mkdir -p "$ROOT"/{build,cache,config,security,clang,tmp,tests,state}
          {
            echo "SIMQ_CI_ROOT=$ROOT"
            echo "CLANG_MODULE_CACHE_PATH=$ROOT/clang"
            echo "TMPDIR=$ROOT/tmp/"
            echo "SIMQ_TEST_TMPDIR=$ROOT/tests"
            echo "SIMQ_STATE_DIR=$ROOT/state"
          } >> "$GITHUB_ENV"
          test "${#ROOT}" -le 76
      - name: Build executable and test targets
        timeout-minutes: 15
        run: |
          set -euo pipefail
          /usr/sbin/taskpolicy -b /usr/bin/swift build --build-tests --arch arm64 -j 2 \
            --scratch-path "$SIMQ_CI_ROOT/build" --cache-path "$SIMQ_CI_ROOT/cache" \
            --config-path "$SIMQ_CI_ROOT/config" --security-path "$SIMQ_CI_ROOT/security"
      - name: Menu bar app packaging
        run: |
          set -euo pipefail
          BIN="$(/usr/bin/swift build --arch arm64 --scratch-path "$SIMQ_CI_ROOT/build" --show-bin-path)"
          scripts/package-app.sh "$BIN" "$RUNNER_TEMP/app"
          plutil -lint "$RUNNER_TEMP/app/SimQueue.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$RUNNER_TEMP/app/SimQueue.app/Contents/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$RUNNER_TEMP/app/SimQueue.app/Contents/Info.plist")" = SimQueue.icns
          test -s "$RUNNER_TEMP/app/SimQueue.app/Contents/Resources/SimQueue.icns"
          iconutil -c iconset "$RUNNER_TEMP/app/SimQueue.app/Contents/Resources/SimQueue.icns" -o "$RUNNER_TEMP/verified.iconset"
          codesign --verify --deep --strict "$RUNNER_TEMP/app/SimQueue.app"
          test "$("$RUNNER_TEMP/app/SimQueue.app/Contents/Helpers/simqd" --version)" = "$("$BIN/simqd" --version)"
          # Setup B: the cask links the app's own simq; it must run, match and find its docs.
          APP_CLI="$RUNNER_TEMP/app/SimQueue.app/Contents/Helpers/simq"
          test -x "$APP_CLI"
          codesign --verify --strict "$APP_CLI"
          codesign --display --verbose=2 "$APP_CLI" 2>&1 | grep -q '^Identifier=dev.simqueue.cli$'
          test "$("$APP_CLI" --version)" = "$("$BIN/simq" --version)"
          mkdir -p "$RUNNER_TEMP/cask-bin"
          ln -s "$APP_CLI" "$RUNNER_TEMP/cask-bin/simq"
          test "$("$RUNNER_TEMP/cask-bin/simq" docs)" -ef "$RUNNER_TEMP/app/SimQueue.app/Contents/Resources/doc/simqueue"
          test -s "$RUNNER_TEMP/app/SimQueue.app/Contents/Resources/doc/simqueue/skills/simqueue/SKILL.md"
          "$RUNNER_TEMP/cask-bin/simq" agent-guide | grep -q "agent guide"
          plutil -lint "$RUNNER_TEMP/app/SimQueue.app/Contents/Library/LaunchAgents/dev.simqueue.app-daemon.plist"
          "$RUNNER_TEMP/app/SimQueue.app/Contents/Helpers/simqd" run --foreground --backend fake --probe fake \
            --log-to-state --exit-after-startup --state-dir "$SIMQ_CI_ROOT/bundled-smoke"
          test -s "$SIMQ_CI_ROOT/bundled-smoke/simqd.log"
      - name: Build and test the read-only Sparkle feed probe
        run: |
          set -euo pipefail
          BIN="$(/usr/bin/swift build --arch arm64 --scratch-path "$SIMQ_CI_ROOT/build" --show-bin-path)"
          mkdir -p "$RUNNER_TEMP/feed-probe" "$RUNNER_TEMP/feed-fixture"
          /usr/bin/swiftc -j 2 -target arm64-apple-macos14.0 -parse-as-library -F "$BIN" -framework Sparkle \
            -Xlinker -rpath -Xlinker @executable_path Tests/Release/feed_probe.swift \
            -o "$RUNNER_TEMP/feed-probe/feed-probe"
          ditto "$BIN/Sparkle.framework" "$RUNNER_TEMP/feed-probe/Sparkle.framework"
          python3 Tests/Release/feed_probe_test.py "$RUNNER_TEMP/feed-probe/feed-probe" "$RUNNER_TEMP/app/SimQueue.app"
          # Preserve framework symlinks and executable permissions across download.
          tar -czf "$RUNNER_TEMP/feed-probe-macos-arm64.tar.gz" -C "$RUNNER_TEMP" feed-probe
      - uses: actions/upload-artifact@v4
        with:
          name: sparkle-feed-probe-macos-arm64
          path: ${{ runner.temp }}/feed-probe-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Full tests without simulator access
        timeout-minutes: 15
        run: |
          set -euo pipefail
          /usr/sbin/taskpolicy -b /usr/bin/swift test --skip-build --arch arm64 -j 2 \
            --scratch-path "$SIMQ_CI_ROOT/build" --cache-path "$SIMQ_CI_ROOT/cache" \
            --config-path "$SIMQ_CI_ROOT/config" --security-path "$SIMQ_CI_ROOT/security" \
            2>&1 | tee "$RUNNER_TEMP/simqueue-tests.log"
      - name: Version and fake daemon smoke
        run: |
          set -euo pipefail
          BIN="$(/usr/bin/swift build --arch arm64 --scratch-path "$SIMQ_CI_ROOT/build" --show-bin-path)"
          test "$("$BIN/simq" --version)" = "$("$BIN/simqd" --version)"
          "$BIN/simq" --help >/dev/null
          "$BIN/simqd" run --foreground --backend fake --probe fake \
            --exit-after-startup --state-dir "$SIMQ_CI_ROOT/smoke"
      - name: Dashboard JavaScript checks
        run: node Tests/Dashboard/dashboard.test.cjs
      - name: Notarization release control flow (fake tools)
        run: |
          python3 Tests/Release/notarization_test.py
          python3 Tests/Release/release_plan_test.py
          python3 Tests/Release/homebrew_test.py
          python3 Tests/Release/appcast_test.py
      - name: Sparkle archive signature verification (ephemeral key)
        run: /usr/bin/swift -j 2 Tests/Release/update_signature_test.swift scripts/verify-sparkle-update.swift
      - name: Swift and shell formatting checks
        run: |
          set -euo pipefail
          /usr/bin/swift format lint --strict --recursive Package.swift Sources Tests
          /usr/bin/swift format lint --strict scripts/verify-sparkle-update.swift
          bash -n scripts/stamp-version.sh scripts/package-release.sh scripts/package-app.sh scripts/notarize-release.sh scripts/fetch-sparkle-tools.sh scripts/package-sparkle-update.sh
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-tests
          path: ${{ runner.temp }}/simqueue-tests.log
          if-no-files-found: ignore
          retention-days: 7
