name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Nonpublishing build version
        type: string
        default: 0.1.0
      notarize:
        description: Sign and notarize the nonpublishing build (requires signing secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIMQ_NO_AUTOSTART: "1"

jobs:
  build:
    name: Apple silicon release archive
    runs-on: xcode-27
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ARM64 toolchain and paths
        run: |
          set -eu
          test "$(uname -m)" = arm64
          /usr/bin/swift --version
          ROOT="$RUNNER_TEMP/sq-release"
          mkdir -p "$ROOT"/{build,cache,config,security,clang,tmp,dist}
          {
            echo "SIMQ_CI_ROOT=$ROOT"
            echo "CLANG_MODULE_CACHE_PATH=$ROOT/clang"
            echo "TMPDIR=$ROOT/tmp/"
          } >> "$GITHUB_ENV"
      - name: Stamp validated version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$EVENT" in
            push) VERSION="$(scripts/stamp-version.sh "$GITHUB_REF_NAME")"; PUBLISH=1 ;;
            workflow_dispatch) VERSION="$(scripts/stamp-version.sh "$DISPATCH_VERSION")"; PUBLISH=0 ;;
            *) exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          { echo "version=$VERSION"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"
      - name: Build ARM64 release
        timeout-minutes: 25
        run: |
          set -euo pipefail
          /usr/sbin/taskpolicy -b /usr/bin/swift build -c release --arch arm64 -j 2 \
            --scratch-path "$SIMQ_CI_ROOT/build" --cache-path "$SIMQ_CI_ROOT/cache" \
            --config-path "$SIMQ_CI_ROOT/config" --security-path "$SIMQ_CI_ROOT/security"
      - name: Verify and package
        run: |
          set -eu
          BIN="$(/usr/bin/swift build -c release --arch arm64 --scratch-path "$SIMQ_CI_ROOT/build" --show-bin-path)"
          TARBALL="$(scripts/package-release.sh "$VERSION" "$BIN" "$SIMQ_CI_ROOT/dist")"
          cat "$TARBALL.sha256"
          tar -tzf "$TARBALL"
      - uses: actions/upload-artifact@v4
        with:
          name: simqueue-${{ steps.version.outputs.version }}-unsigned-macos-arm64
          path: ${{ env.SIMQ_CI_ROOT }}/dist/
          if-no-files-found: error
          retention-days: 14

  notarize:
    name: Developer ID signing and notarization
    needs: build
    if: github.event_name == 'push' || inputs.notarize
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-unsigned-macos-arm64
          path: ${{ runner.temp }}/unsigned
      - name: Sign, notarize and staple
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIMQ_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          SIMQ_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          SIMQ_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          # Tagged releases fail closed if credentials are missing; no unsigned publish.
          : "${CERTIFICATE_P12_BASE64:?Missing signing certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${SIMQ_SIGNING_IDENTITY:?Missing Developer ID identity}"
          : "${NOTARY_KEY_BASE64:?Missing notarization API key}"
          : "${SIMQ_NOTARY_KEY_ID:?Missing notarization key ID}"
          umask 077
          PRIVATE="$RUNNER_TEMP/simqueue-signing"
          mkdir -p "$PRIVATE" "$RUNNER_TEMP/notarized"
          SIMQ_SIGNING_KEYCHAIN="$PRIVATE/signing.keychain-db"
          export SIMQ_SIGNING_KEYCHAIN
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          cleanup() {
            security delete-keychain "$SIMQ_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
            rm -rf "$PRIVATE"
          }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$PRIVATE/certificate.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$PRIVATE/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIMQ_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIMQ_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIMQ_SIGNING_KEYCHAIN"
          security import "$PRIVATE/certificate.p12" -k "$SIMQ_SIGNING_KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIMQ_SIGNING_KEYCHAIN" >/dev/null
          export SIMQ_NOTARY_KEY_PATH="$PRIVATE/notary.p8"
          cd "$RUNNER_TEMP/unsigned"
          NAME="simqueue-$VERSION-macos-arm64"
          shasum -a 256 -c "$NAME.tar.gz.sha256"
          tar -xzf "$NAME.tar.gz"
          "$GITHUB_WORKSPACE/scripts/notarize-release.sh" "$VERSION" \
            "$RUNNER_TEMP/unsigned/$NAME" "$RUNNER_TEMP/notarized"
      - uses: actions/upload-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/notarized/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    needs: [build, notarize]
    if: github.event_name == 'push' && needs.build.outputs.publish == '1'
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/simqueue-dist
      - name: Verify and publish asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST: ${{ runner.temp }}/simqueue-dist
        run: |
          set -euo pipefail
          cd "$DIST"
          NAME="simqueue-$VERSION-macos-arm64.tar.gz"
          shasum -a 256 -c "$NAME.sha256"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; *) FLAGS+=(--latest) ;; esac
          gh release create "$GITHUB_REF_NAME" "$NAME" "$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "SimQueue $VERSION" \
            --generate-notes "${FLAGS[@]}"
