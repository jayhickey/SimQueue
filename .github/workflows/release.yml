name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version for a nonpublishing validation build
        type: string
        default: ""
      notarize:
        description: Sign and notarize the nonpublishing build (disable only for unsigned validation)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-publishing
  cancel-in-progress: false

env:
  SIMQ_NO_AUTOSTART: "1"

jobs:
  prepare:
    name: Verify tested source and select release version
    permissions:
      contents: read
      actions: read
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      notarize: ${{ steps.plan.outputs.notarize }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Plan exact-commit release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py

  build:
    name: Apple silicon release archive
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ needs.prepare.outputs.publish }}
      source: ${{ needs.prepare.outputs.source }}
      notarize: ${{ needs.prepare.outputs.notarize }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/dashboard/package-lock.json
      - name: Build embedded dashboard
        working-directory: Web/dashboard
        run: npm ci --no-audit --no-fund && npm run build
      - name: ARM64 toolchain and paths
        run: |
          set -eu
          test "$(uname -m)" = arm64
          /usr/bin/swift --version
          ROOT="$RUNNER_TEMP/sq-release"
          mkdir -p "$ROOT"/{build,cache,config,security,clang,tmp,dist}
          {
            echo "SIMQ_CI_ROOT=$ROOT"
            echo "CLANG_MODULE_CACHE_PATH=$ROOT/clang"
            echo "TMPDIR=$ROOT/tmp/"
          } >> "$GITHUB_ENV"
      - name: Stamp validated version
        id: version
        env:
          PLANNED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(scripts/stamp-version.sh "$PLANNED_VERSION")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build ARM64 release
        timeout-minutes: 25
        run: |
          set -euo pipefail
          /usr/sbin/taskpolicy -b /usr/bin/swift build -c release --arch arm64 -j 2 \
            --scratch-path "$SIMQ_CI_ROOT/build" --cache-path "$SIMQ_CI_ROOT/cache" \
            --config-path "$SIMQ_CI_ROOT/config" --security-path "$SIMQ_CI_ROOT/security"
      - name: Verify and package
        run: |
          set -eu
          BIN="$(/usr/bin/swift build -c release --arch arm64 --scratch-path "$SIMQ_CI_ROOT/build" --show-bin-path)"
          TARBALL="$(scripts/package-release.sh "$VERSION" "$BIN" "$SIMQ_CI_ROOT/dist")"
          cat "$TARBALL.sha256"
          tar -tzf "$TARBALL"
      - uses: actions/upload-artifact@v4
        with:
          name: simqueue-${{ steps.version.outputs.version }}-unsigned-macos-arm64
          path: ${{ env.SIMQ_CI_ROOT }}/dist/
          if-no-files-found: error
          retention-days: 3

  notarize:
    name: Developer ID signing and notarization
    needs: build
    if: needs.build.outputs.notarize == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-unsigned-macos-arm64
          path: ${{ runner.temp }}/unsigned
      - name: Sign, notarize and staple
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIMQ_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIMQ_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          SIMQ_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          # Tagged releases fail closed if credentials are missing; no unsigned publish.
          : "${CERTIFICATE_P12_BASE64:?Missing signing certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${SIMQ_SIGNING_IDENTITY:?Missing Developer ID identity}"
          : "${NOTARY_KEY_BASE64:?Missing notarization API key}"
          : "${SIMQ_NOTARY_KEY_ID:?Missing notarization key ID}"
          umask 077
          PRIVATE="$RUNNER_TEMP/simqueue-signing"
          mkdir -p "$PRIVATE" "$RUNNER_TEMP/notarized"
          SIMQ_SIGNING_KEYCHAIN="$PRIVATE/signing.keychain-db"
          export SIMQ_SIGNING_KEYCHAIN
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          cleanup() {
            security delete-keychain "$SIMQ_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
            rm -rf "$PRIVATE"
          }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$PRIVATE/certificate.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$PRIVATE/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIMQ_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIMQ_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIMQ_SIGNING_KEYCHAIN"
          security import "$PRIVATE/certificate.p12" -k "$SIMQ_SIGNING_KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIMQ_SIGNING_KEYCHAIN" >/dev/null
          export SIMQ_NOTARY_KEY_PATH="$PRIVATE/notary.p8"
          cd "$RUNNER_TEMP/unsigned"
          NAME="simqueue-$VERSION-macos-arm64"
          shasum -a 256 -c "$NAME.tar.gz.sha256"
          tar -xzf "$NAME.tar.gz"
          "$GITHUB_WORKSPACE/scripts/notarize-release.sh" "$VERSION" \
            "$RUNNER_TEMP/unsigned/$NAME" "$RUNNER_TEMP/notarized"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            : "${SPARKLE_PRIVATE_KEY:?Missing Sparkle Ed25519 signing key}"
            "$GITHUB_WORKSPACE/scripts/fetch-sparkle-tools.sh" "$RUNNER_TEMP/sparkle-sdk"
            "$GITHUB_WORKSPACE/scripts/package-sparkle-update.sh" "$VERSION" \
              "$RUNNER_TEMP/unsigned/$NAME" "$RUNNER_TEMP/notarized" "$RUNNER_TEMP/sparkle-sdk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/notarized/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish tagged release
    needs: [build, notarize]
    if: needs.build.outputs.publish == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/simqueue-dist
      - name: Verify and publish asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source }}
          DIST: ${{ runner.temp }}/simqueue-dist
        run: |
          set -euo pipefail
          cd "$DIST"
          NAME="simqueue-$VERSION-macos-arm64.tar.gz"
          shasum -a 256 -c "$NAME.sha256"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; *) FLAGS+=(--latest) ;; esac
          TAG="v$VERSION"
          # Create tags only after signing/notarization; never move an existing tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            [ "$TAG_SHA" = "$SOURCE_SHA" ] || { echo 'Tag belongs to a different source commit' >&2; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          ASSETS=("$NAME" "$NAME.sha256")
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            shasum -a 256 -c "SimQueue-$VERSION.zip.sha256"
            test -s appcast.xml
            ASSETS+=("SimQueue-$VERSION.zip" "SimQueue-$VERSION.zip.sha256" appcast.xml)
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "SimQueue $VERSION" \
            --generate-notes "${FLAGS[@]}"

  homebrew:
    name: Update Homebrew formula and app cask
    needs: [build, publish]
    if: needs.build.outputs.publish == 'true' && !contains(needs.build.outputs.version, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/simqueue-dist
      - name: Update tap from the published signed archive
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || format('{0}/homebrew-tap', github.repository_owner) }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          DIST: ${{ runner.temp }}/simqueue-dist
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing HOMEBREW_TAP_TOKEN: fine-grained Contents read/write access to the tap only}"
          python3 scripts/update-homebrew.py "$TAP_REPOSITORY" "$SOURCE_REPOSITORY" "$VERSION" \
            "$DIST/simqueue-$VERSION-macos-arm64.tar.gz"
