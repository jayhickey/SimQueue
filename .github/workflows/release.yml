name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Nonpublishing build version
        type: string
        default: 0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIMQ_NO_AUTOSTART: "1"

jobs:
  build:
    name: Apple silicon release archive
    runs-on: xcode-27
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ARM64 toolchain and paths
        run: |
          set -eu
          test "$(uname -m)" = arm64
          /usr/bin/swift --version
          ROOT="$RUNNER_TEMP/sq-release"
          mkdir -p "$ROOT"/{build,cache,config,security,clang,tmp,dist}
          {
            echo "SIMQ_CI_ROOT=$ROOT"
            echo "CLANG_MODULE_CACHE_PATH=$ROOT/clang"
            echo "TMPDIR=$ROOT/tmp/"
          } >> "$GITHUB_ENV"
      - name: Stamp validated version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$EVENT" in
            push) VERSION="$(scripts/stamp-version.sh "$GITHUB_REF_NAME")"; PUBLISH=1 ;;
            workflow_dispatch) VERSION="$(scripts/stamp-version.sh "$DISPATCH_VERSION")"; PUBLISH=0 ;;
            *) exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          { echo "version=$VERSION"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"
      - name: Build ARM64 release
        timeout-minutes: 25
        run: |
          set -euo pipefail
          /usr/sbin/taskpolicy -b /usr/bin/swift build -c release --arch arm64 -j 2 \
            --scratch-path "$SIMQ_CI_ROOT/build" --cache-path "$SIMQ_CI_ROOT/cache" \
            --config-path "$SIMQ_CI_ROOT/config" --security-path "$SIMQ_CI_ROOT/security"
      - name: Verify and package
        run: |
          set -eu
          BIN="$(/usr/bin/swift build -c release --arch arm64 --scratch-path "$SIMQ_CI_ROOT/build" --show-bin-path)"
          TARBALL="$(scripts/package-release.sh "$VERSION" "$BIN" "$SIMQ_CI_ROOT/dist")"
          cat "$TARBALL.sha256"
          tar -tzf "$TARBALL"
      - uses: actions/upload-artifact@v4
        with:
          name: simqueue-${{ steps.version.outputs.version }}-macos-arm64
          path: ${{ env.SIMQ_CI_ROOT }}/dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.publish == '1'
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simqueue-${{ needs.build.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/simqueue-dist
      - name: Verify and publish asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST: ${{ runner.temp }}/simqueue-dist
        run: |
          set -euo pipefail
          cd "$DIST"
          NAME="simqueue-$VERSION-macos-arm64.tar.gz"
          shasum -a 256 -c "$NAME.sha256"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; *) FLAGS+=(--latest) ;; esac
          gh release create "$GITHUB_REF_NAME" "$NAME" "$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "SimQueue $VERSION" \
            --generate-notes "${FLAGS[@]}"
